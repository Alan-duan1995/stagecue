<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><style>body{background:#292b2e;color:#ddd;font:12px system-ui;margin:14px}label{display:block;margin:12px 0}input,select{display:block;box-sizing:border-box;width:100%;margin-top:5px;padding:7px;background:#171a1d;border:1px solid #53575b;border-radius:4px;color:#eee}button{padding:8px 12px;background:#b7e678;color:#19210f;border:0;border-radius:4px;cursor:pointer}small{color:#9ba3a8;line-height:1.7;display:block}h3{font-size:13px;color:#b7e678}#status{margin:12px 0;color:#c4d6ad}.section{border-top:1px solid #494e52;padding-top:8px;margin-top:15px}</style>
<h3>StageCue Live</h3><small>在客户端“Stream Deck”面板启用控制服务，复制配对码。所有连接仅限本机。</small><label>客户端端口<input id="port" type="number" min="1" max="65535" value="9142"></label><label>配对码<input id="token" type="password" autocomplete="off"></label><button id="save-pair">保存配对设置</button><div id="status">等待连接 Stream Deck…</div>
<div class="section" id="cue-fields"><label>绑定方式<select id="binding"><option value="page">当前音效页的位置</option><option value="fixed">固定音效 ID</option></select></label><label>页内位置（1–48）<input id="slot" type="number" min="1" max="48" value="1"></label><label>从当前页选择固定音效<select id="cue-list"><option value="">等待客户端状态</option></select></label><label>固定音效 ID<input id="cueId"></label></div>
<div class="section" id="command-fields"><label>控制动作<select id="command"><option value="togglePlay">播放 / 暂停</option><option value="play">播放</option><option value="pause">暂停</option><option value="stop">停止全部声音</option><option value="go">GO 下一条</option><option value="next">下一首</option><option value="prev">上一首</option><option value="pageNext">下一页</option><option value="pagePrev">上一页</option><option value="resetUsed">重置已播状态</option><option value="queue">自动续播开关</option><option value="shuffle">随机开关</option><option value="loop">单曲循环开关</option><option value="multi">叠加播放开关</option><option value="duck">背景压低 / 恢复</option><option value="talk">讲话 / 恢复</option><option value="monitor">Monitor 开关</option></select></label></div>
<div class="section" id="dial-fields"><label>旋钮参数<select id="parameter"><option value="volume">音量</option><option value="pitch">音高（半音）</option><option value="tempo">速度（百分比）</option><option value="reverb">混响（百分比）</option></select></label><label>每格变化量<input id="step" type="number" min=".1" max="10" step=".1" value="1"></label><small>速度和混响的 1 表示 1%；音高的 1 表示 1 个半音。按压旋钮切换播放 / 暂停。</small></div><button id="save-action">保存按钮设置</button><small class="section">中东中亚IT SSC   Alan</small>
<script>
let socket,uuid,context,action,actionSettings={};const $=id=>document.getElementById(id);const send=(event,ctx,payload)=>{if(socket?.readyState===1)socket.send(JSON.stringify({event,context:ctx,payload}))};function fill(){for(const id of ['binding','slot','cueId','command','parameter','step'])if(actionSettings[id]!==undefined)$(id).value=actionSettings[id];$('cue-fields').style.display=action.endsWith('.cue')?'block':'none';$('command-fields').style.display=action.endsWith('.command')?'block':'none';$('dial-fields').style.display=action.endsWith('.dial')?'block':'none'}function receiveState(payload){const state=payload.state;$('status').textContent=payload.connected?'客户端已连接 · '+(state?.page||''):'尚未连接客户端，请检查端口与配对码';if(state){$('cue-list').innerHTML='<option value="">选择音效…</option>';for(const [index,cue]of state.buttons.entries())if(cue.id){const option=document.createElement('option');option.value=cue.id;option.textContent=(index+1)+'. '+cue.name;$('cue-list').append(option)}}}
window.connectElgatoStreamDeckSocket=(port,inUUID,registerEvent,info,actionInfo)=>{uuid=inUUID;const parsed=JSON.parse(actionInfo);context=parsed.context||inUUID;action=parsed.action;actionSettings=parsed.payload?.settings||{};fill();socket=new WebSocket('ws://127.0.0.1:'+port);socket.onopen=()=>{socket.send(JSON.stringify({event:registerEvent,uuid}));send('getGlobalSettings',uuid,{});send('sendToPlugin',context,{request:'state'})};socket.onmessage=event=>{let m;try{m=JSON.parse(event.data)}catch{return}if(m.event==='didReceiveGlobalSettings'){const s=m.payload.settings||{};if(document.activeElement!==$('port'))$('port').value=s.port||9142;if(document.activeElement!==$('token'))$('token').value=s.token||''}if(m.event==='didReceiveSettings'){actionSettings=m.payload.settings||{};fill()}if(m.event==='sendToPropertyInspector')receiveState(m.payload)}};
$('save-pair').onclick=()=>{const port=+$('port').value,token=$('token').value.trim();if(!Number.isInteger(port)||port<1||port>65535||!/^[0-9a-f]{64}$/.test(token)){$('status').textContent='请输入正确端口和 64 位配对码';return}send('setGlobalSettings',uuid,{port,token});send('sendToPlugin',context,{request:'state'});$('status').textContent='配对设置已保存，正在连接…'};
$('cue-list').onchange=()=>{$('cueId').value=$('cue-list').value;$('binding').value='fixed'};$('save-action').onclick=()=>{actionSettings={binding:$('binding').value,slot:Math.max(1,Math.min(48,+$('slot').value||1)),cueId:$('cueId').value.trim(),command:$('command').value,parameter:$('parameter').value,step:Math.max(.1,Math.min(10,+$('step').value||1))};send('setSettings',context,actionSettings);send('sendToPlugin',context,{request:'state'});$('status').textContent='按钮设置已保存'};
</script></html>
